[project]
name = "project-hunter"
version = "0.2.1"
description = "移动端工具类 App UI 交互 Bug 猎手 — 支持 Flutter / Android Native / React Native / iOS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["flutter", "android", "react-native", "ios", "github", "bug", "cli", "mobile"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = ["typer"]

[project.scripts]
project-hunter = "hunter:app"

[tool.setuptools]
py-modules = ["hunter"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
